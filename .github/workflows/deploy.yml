name: Deploy Spring Boot to Server

on:
  push:
    branches:
      - powerhub-hes-staging
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/powerhub-hes-staging' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      # =====================
      # Checkout
      # =====================
      - name: Checkout code
        uses: actions/checkout@v4

      # =====================
      # Java Setup
      # =====================
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # =====================
      # Build
      # =====================
      - name: Build with Maven
        run: mvn -B clean package -DskipTests

      # =====================
      # Resolve JAR
      # =====================
      - name: Resolve JAR
        shell: bash
        run: |
          set -euo pipefail

          JAR_FILE="$(find target -maxdepth 1 -type f \
            -name '*.jar' \
            ! -name '*original*.jar' \
            | head -n 1)"

          if [[ -z "$JAR_FILE" ]]; then
            echo "ERROR: No application JAR found in target/"
            exit 1
          fi

          echo "JAR_FILE=$JAR_FILE" >> "$GITHUB_ENV"
          echo "Found: $JAR_FILE"

      # =====================
      # SSH Setup - Staging
      # =====================
      - name: Setup SSH (Staging)
        if: github.ref == 'refs/heads/powerhub-hes-staging'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}

      # =====================
      # SSH Setup - Production
      # =====================
      - name: Setup SSH (Production)
        if: github.ref == 'refs/heads/main'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}

      # =====================
      # Prepare Environment File
      # =====================
      - name: Prepare deployment environment
        shell: bash
        env:
          APP_PROFILE: ${{ github.ref == 'refs/heads/powerhub-hes-staging' && 'staging' || 'prod' }}

          DB_HOST: ${{ github.ref == 'refs/heads/powerhub-hes-staging' && secrets.STAGING_DB_HOST || secrets.PROD_DB_HOST }}
          DB_PORT: ${{ github.ref == 'refs/heads/powerhub-hes-staging' && secrets.STAGING_DB_PORT || secrets.PROD_DB_PORT }}
          POSTGRES_DB: ${{ github.ref == 'refs/heads/powerhub-hes-staging' && secrets.STAGING_DB_NAME || secrets.PROD_DB_NAME }}
          POSTGRES_USER: ${{ github.ref == 'refs/heads/powerhub-hes-staging' && secrets.STAGING_DB_USERNAME || secrets.PROD_DB_USERNAME }}
          POSTGRES_PASSWORD: ${{ github.ref == 'refs/heads/powerhub-hes-staging' && secrets.STAGING_DB_PASSWORD || secrets.PROD_DB_PASSWORD }}

          EUREKA_ADDRESS: ${{ secrets.EUREKA_ADDRESS }}
          EUREKA_PORT: ${{ secrets.EUREKA_PORT }}
          LOCATION: ${{ secrets.LOCATION }}

          TOKEN_ISSUER: ${{ secrets.T_ISSUER }}
          TOKEN_ACCESS: ${{ secrets.T_ACCESS }}
          TOKEN_REFRESH: ${{ secrets.T_REFRESH }}
          TOKEN_SECRET: ${{ secrets.T_SECRET }}

          SPRING_SECURITY_USER: ${{ secrets.SPRING_SECURITY_USER }}
          SPRING_SECURITY_PASSWORD: ${{ secrets.SPRING_SECURITY_PASSWORD }}

        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          from pathlib import Path

          keys = [
              "DB_HOST",
              "DB_PORT",
              "POSTGRES_DB",
              "POSTGRES_USER",
              "POSTGRES_PASSWORD",
              "EUREKA_ADDRESS",
              "EUREKA_PORT",
              "LOCATION",
              "TOKEN_ISSUER",
              "TOKEN_ACCESS",
              "TOKEN_REFRESH",
              "TOKEN_SECRET",
              "SPRING_SECURITY_USER",
              "SPRING_SECURITY_PASSWORD",
          ]

          def quote_systemd_env(value):
              if "\n" in value or "\r" in value:
                  raise ValueError(
                      "Environment values must not contain newline characters."
                  )

              value = value.replace("\\", "\\\\").replace('"', '\\"')
              return f'"{value}"'

          lines = []

          for key in keys:
              value = os.environ.get(key, "")
              if not value:
                  raise ValueError(
                      f"Required deployment value {key} is empty. "
                      "Check the corresponding GitHub Actions secret."
                  )

              lines.append(f"{key}={quote_systemd_env(value)}")

          Path(".env.powerhub-hes").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )

          os.chmod(".env.powerhub-hes", 0o600)
          print("Environment file prepared with restricted permissions.")
          PY

      # =====================
      # Deploy
      # =====================
      - name: Deploy PowerHub HES with systemd
        shell: bash
        env:
          SERVER_USER: ${{ github.ref == 'refs/heads/powerhub-hes-staging' && secrets.STAGING_SERVER_USER || secrets.PROD_SERVER_USER }}
          SERVER_HOST: ${{ github.ref == 'refs/heads/powerhub-hes-staging' && secrets.STAGING_SERVER_HOST || secrets.PROD_SERVER_HOST }}
          SSH_PORT: ${{ github.ref == 'refs/heads/powerhub-hes-staging' && secrets.STAGING_SSH_PORT || secrets.PROD_SSH_PORT || '22' }}
          LOCATION: ${{ secrets.LOCATION }}
          APP_PROFILE: ${{ github.ref == 'refs/heads/powerhub-hes-staging' && 'staging' || 'prod' }}

        run: |
          set -euo pipefail

          if [[ -z "$SERVER_USER" || -z "$SERVER_HOST" || -z "$LOCATION" ]]; then
            echo "ERROR: Server credentials and LOCATION must be configured."
            exit 1
          fi

          SERVER="${SERVER_USER}@${SERVER_HOST}"
          REMOTE_DIR="/${LOCATION#/}"
          REMOTE_JAR="${REMOTE_DIR}/powerhub-hes-service.jar"
          REMOTE_ENV="${REMOTE_DIR}/.env.powerhub-hes"
          SERVICE_NAME="powerhub-hes"
          UNIT_FILE="/etc/systemd/system/${SERVICE_NAME}.service"

          SSH_OPTS=(
            -p "$SSH_PORT"
            -o StrictHostKeyChecking=no
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=3
          )

          RSYNC_RSH="ssh -p ${SSH_PORT} -o StrictHostKeyChecking=no -o ServerAliveInterval=30"

          echo "========================================"
          echo "Deploying PowerHub HES"
          echo "Branch: ${GITHUB_REF_NAME}"
          echo "Server: ${SERVER}"
          echo "Directory: ${REMOTE_DIR}"
          echo "Profile: ${APP_PROFILE}"
          echo "========================================"

          # Create the application directory.
          ssh "${SSH_OPTS[@]}" "$SERVER" \
            "mkdir -p '$REMOTE_DIR'"

          # Preserve an existing unit file.
          # Create a default unit only if one is missing.
          if ! ssh "${SSH_OPTS[@]}" "$SERVER" \
            "sudo test -f '$UNIT_FILE'"; then

            echo "No existing ${SERVICE_NAME}.service found."
            echo "Creating a default systemd unit..."

            ssh "${SSH_OPTS[@]}" "$SERVER" \
              "sudo bash -s -- '$SERVER_USER' '$REMOTE_DIR' '$APP_PROFILE'" <<'REMOTE'
          set -euo pipefail

          SERVICE_USER="$1"
          APP_DIR="$2"
          APP_PROFILE="$3"
          UNIT_FILE="/etc/systemd/system/powerhub-hes.service"

          if [ ! -f "$UNIT_FILE" ]; then
            cat > /tmp/powerhub-hes.service <<EOF
          [Unit]
          Description=PowerHub HES Service
          After=network.target

          [Service]
          Type=simple
          User=${SERVICE_USER}
          WorkingDirectory=${APP_DIR}
          EnvironmentFile=-${APP_DIR}/.env.powerhub-hes
          ExecStart=/usr/bin/java -Dspring.profiles.active=${APP_PROFILE} -jar ${APP_DIR}/powerhub-hes-service.jar
          Restart=on-failure
          RestartSec=10
          SuccessExitStatus=143

          [Install]
          WantedBy=multi-user.target
          EOF

            install -o root -g root -m 644 \
              /tmp/powerhub-hes.service "$UNIT_FILE"
            rm -f /tmp/powerhub-hes.service
          fi
          REMOTE
          fi

          # Stop the systemd service before replacing files.
          echo "Stopping ${SERVICE_NAME}..."

          ssh "${SSH_OPTS[@]}" "$SERVER" \
            "sudo systemctl stop '$SERVICE_NAME' || true"

          # Clean up any old manually launched instance.
          echo "Checking for legacy Java processes..."

          ssh "${SSH_OPTS[@]}" "$SERVER" \
            "sudo bash -s -- '$REMOTE_JAR'" <<'REMOTE'
          set -euo pipefail

          APP_JAR="$1"

          mapfile -t PIDS < <(
            ps -C java -o pid=,args= |
              awk -v jar="$APP_JAR" \
                'index($0, "-jar " jar) > 0 { print $1 }'
          )

          if [ "${#PIDS[@]}" -eq 0 ]; then
            echo "No legacy Java process found."
            exit 0
          fi

          for PID in "${PIDS[@]}"; do
            STATE="$(ps -o stat= -p "$PID" 2>/dev/null | awk '{print $1}')"

            if [ -n "$STATE" ] && [[ "$STATE" != Z* ]]; then
              echo "Sending TERM to process $PID..."
              kill -TERM "$PID" 2>/dev/null || true
            fi
          done

          for attempt in $(seq 1 15); do
            REMAINING=0

            for PID in "${PIDS[@]}"; do
              STATE="$(ps -o stat= -p "$PID" 2>/dev/null | awk '{print $1}')"

              if [ -n "$STATE" ] && [[ "$STATE" != Z* ]]; then
                REMAINING=1
              fi
            done

            [ "$REMAINING" -eq 0 ] && break
            sleep 1
          done

          for PID in "${PIDS[@]}"; do
            STATE="$(ps -o stat= -p "$PID" 2>/dev/null | awk '{print $1}')"

            if [ -n "$STATE" ] && [[ "$STATE" != Z* ]]; then
              echo "Process $PID did not stop; sending KILL..."
              kill -KILL "$PID" 2>/dev/null || true
            fi
          done

          for PID in "${PIDS[@]}"; do
            STATE="$(ps -o stat= -p "$PID" 2>/dev/null | awk '{print $1}')"

            if [ -n "$STATE" ] && [[ "$STATE" != Z* ]]; then
              echo "ERROR: Process $PID is still running."
              exit 1
            fi
          done
          REMOTE

          # Upload the JAR. Do not use --delete.
          echo "Uploading application JAR..."

          rsync -az \
            -e "$RSYNC_RSH" \
            "$JAR_FILE" \
            "${SERVER}:${REMOTE_JAR}"

          # Upload the environment file with mode 600.
          echo "Uploading environment file..."

          rsync -az \
            --chmod=F600 \
            -e "$RSYNC_RSH" \
            ".env.powerhub-hes" \
            "${SERVER}:${REMOTE_ENV}"

          # Verify permissions and reload systemd.
          ssh "${SSH_OPTS[@]}" "$SERVER" \
            "set -e;
             sudo chmod 600 '$REMOTE_ENV';
             ls -l '$REMOTE_ENV';
             sudo systemctl daemon-reload;
             sudo systemctl enable '$SERVICE_NAME'"

          # Start under systemd.
          echo "Starting ${SERVICE_NAME}..."

          ssh "${SSH_OPTS[@]}" "$SERVER" \
            "sudo systemctl start '$SERVICE_NAME'"

          # Wait for successful activation.
          echo "Verifying service startup..."

          ACTIVE=false

          for attempt in $(seq 1 30); do
            if ssh "${SSH_OPTS[@]}" "$SERVER" \
              "sudo systemctl is-active --quiet '$SERVICE_NAME'"; then
              ACTIVE=true
              break
            fi

            echo "Waiting for service... attempt ${attempt}/30"
            sleep 2
          done

          if [[ "$ACTIVE" != "true" ]]; then
            echo "ERROR: ${SERVICE_NAME} failed to become active."

            ssh "${SSH_OPTS[@]}" "$SERVER" \
              "sudo systemctl status '$SERVICE_NAME' --no-pager -l || true;
               sudo journalctl -u '$SERVICE_NAME' -n 100 --no-pager || true"

            exit 1
          fi

          echo "Deployment successful."

          ssh "${SSH_OPTS[@]}" "$SERVER" \
            "sudo systemctl status '$SERVICE_NAME' --no-pager -l"

      # =====================
      # Cleanup local secrets file
      # =====================
      - name: Remove temporary environment file
        if: always()
        run: rm -f .env.powerhub-hes




